[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "gcc", "postgresql"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "python -m pip install -r backend/requirements.txt --no-cache-dir"
]

[phases.build]
cmds = []

[start]
cmd = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
