version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: nexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [nexus]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks: [nexus]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: nexus_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [nexus]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - ./knowledge_base:/app/knowledge_base
    networks: [nexus]
    ports:
      - "8000:8000"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus_celery
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    networks: [nexus]

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus_beat
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - celery_worker
    volumes:
      - ./backend:/app
    networks: [nexus]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: nexus_frontend
    restart: unless-stopped
    networks: [nexus]
    ports:
      - "3000:80"

  telegram_bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: nexus_bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      - backend
    volumes:
      - ./bot:/app
    networks: [nexus]

  nginx:
    image: nginx:alpine
    container_name: nexus_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks: [nexus]

  backup:
    image: postgres:16-alpine
    container_name: nexus_backup
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - backups_data:/backups
    networks: [nexus]
    entrypoint: crond -f
    command: -l 2

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  uploads_data:
  backups_data:
  certbot_data:

networks:
  nexus:
    driver: bridge
